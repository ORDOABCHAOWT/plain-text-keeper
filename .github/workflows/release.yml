name: Release app bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep for the verification scripts
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Verify settings UI invariants
        run: Tests/verify_settings_ui.sh
      - name: Verify launch feedback invariants
        run: Tests/verify_launch_feedback.sh
      - name: Build app bundle
        run: INSTALL_APP=0 ./build.sh
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Plain Text Keeper.app" "dist/PlainTextKeeper-${GITHUB_REF_NAME}-macos-arm64.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/PlainTextKeeper-${GITHUB_REF_NAME}-macos-arm64.zip" --generate-notes
