name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep for the verification scripts
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Verify settings UI invariants
        run: Tests/verify_settings_ui.sh
      - name: Verify launch feedback invariants
        run: Tests/verify_launch_feedback.sh
      - name: Build app bundle
        run: INSTALL_APP=0 ./build.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict "dist/Plain Text Keeper.app"
